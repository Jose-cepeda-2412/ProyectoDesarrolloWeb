<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/styles.css}" />
    <title>Mostrar servicios</title>
  </head>
  <body>
    <h1 class="text-center">Mostrar servicios</h1>
    <div class="container">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr class="text-center">
              <th scope="col">Nombre</th>
              <th scope="col">Descripción</th>
              <th scope="col">Precio</th>
              <th scope="col">Estado servicio</th>
              <th scope="col">Modificar servicio</th>
              <th scope="col">Cambiar estado servicio</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="servicio : ${servicios}">
              <td th:text="${servicio.nombre}"></td>
              <td th:text="${servicio.descripcion}"></td>
              <td th:text="${servicio.precio}"></td>
              <td th:text="${servicio.activo}"></td>
              <td>
                <a
                  th:href="@{/servicios/modificarServicio/{id} (id =${servicio.id})}"
                >
                  <button class="btn btn-primary" type="button">
                    Modificar servicio
                  </button>
                </a>
              </td>
              <td>
                <a
                  th:href="@{/servicios/cambiarEstado/{id} (id =${servicio.id})}"
                >
                  <button class="btn btn-primary" type="button">
                    Modificar estado servicio
                  </button>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="text-center">
      <a th:href="@{/servicios/crearServicio}">
        <button class="btn btn-primary" type="button">Crear servicio</button>
      </a>
      <a th:href="@{/usuario}">
        <button class="btn btn-primary" type="button">Ver usuarios</button>
      </a>
      <a th:href="@{/reserva}">
        <button class="btn btn-primary" type="button">Ver reservas</button>
      </a>
      <a th:href="@{/espacios}">
        <button class="btn btn-primary" type="button">Ver espacios</button>
      </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
