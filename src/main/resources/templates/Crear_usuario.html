<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/styles.css}" />
    <title>Crear usuario</title>
  </head>
  <body>
    <h1 class="text-center">Crear usuario</h1>

    <div class="container">
      <form
        th:object="${usuario}"
        th:action="@{/usuario/guardar}"
        method="post"
      >
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
          <label for="nombreUsuario" class="form-label">Nombre</label>
          <input
            type="text"
            th:field="*{nombre}"
            required
            minlength="1"
            maxlength="100"
            class="form-control"
            id="nombreUsuario"
            placeholder="Nombre usuario"
          />
          <br />
        </div>

        <div class="mb-3">
          <label for="correoUsuario" class="form-label"
            >Correo electronico</label
          >
          <input
            type="email"
            th:field="*{email}"
            required
            minlength="1"
            maxlength="100"
            class="form-control"
            id="correoUsuario"
            placeholder="Correo electronico (ej: prueba@gmail.com)"
          />
          <br />
        </div>

        <div class="mb-3">
          <label for="telefonoUsuario" class="form-label">Telefono</label>
          <input
            type="text"
            th:field="*{telefono}"
            required
            minlength="10"
            maxlength="10"
            pattern="[0-9]{10}"
            class="form-control"
            id="telefonoUsuario"
            placeholder="Telefono (10 digitos ej:1234567890)"
          />
          <br />
        </div>

        <div class="mb-3">
          <label for="contraseniaUsuario" class="form-label">Contraseña</label>
          <input
            type="password"
            th:field="*{contrasenia}"
            th:required="${usuario.id== null}"
            minlength="1"
            maxlength="50"
            class="form-control"
            id="contraseniaUsuario"
            placeholder="**********"
          />
          <br />
        </div>

        <div class="mb-3">
          <label for="rolUsuario" class="form-label">Rol</label>
          <select
            id="rolUsuario"
            class="form-select"
            th:field="*{rol}"
            required
          >
            <option value="CLIENTE">Cliente</option>
            <option value="ADMINISTRADOR">Administrador</option>
            <option value="BARBERO">Barbero</option>
          </select>
          <br />
        </div>

        <div class="text-center">
          <a th:href="@{usuario/guardar}">
            <button class="btn btn-primary" type="submit">Crear usuario</button>
          </a>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
