<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/styles.css}" />
    <title>Listar Usuarios</title>
  </head>
  <body>
    <h1 class="text-center">Listar Usuarios</h1>

    <div class="container">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th scope="col">id</th>
              <th scope="col">Nombre</th>
              <th scope="col">Email</th>
              <th scope="col">Telefono</th>
              <th scope="col">Rol</th>
              <th scope="col">Fecha registro</th>
              <th scope="col">Estado usuario</th>
              <th scope="col">Modificar usuario</th>
              <th scope="col">Modificar estado usuario</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="usuario : ${usuarios}">
              <td th:text="${usuario.id}"></td>
              <td th:text="${usuario.nombre}"></td>
              <td th:text="${usuario.email}"></td>
              <td th:text="${usuario.telefono}"></td>
              <td th:text="${usuario.rol}"></td>
              <td th:text="${usuario.fechaRegistro}"></td>
              <td th:text="${usuario.activo}"></td>
              <td>
                <a th:href="@{/usuario/actualizar/{id}(id =${usuario.id})}">
                  <button class="btn btn-primary" type="button">
                    Modificar Usuario
                  </button>
                </a>
              </td>
              <td>
                <a th:href="@{/usuario/cambiarEstado/{id}(id =${usuario.id})}">
                  <button class="btn btn-primary" type="button">
                    Modificar Estado usuario
                  </button>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="text-center">
      <a th:href="@{/usuario/crearUsuario}">
        <button class="btn btn-primary" type="button">Crear usuario</button>
      </a>
      <a th:href="@{/reserva}">
        <button class="btn btn-primary" type="button">Ver reservas</button>
      </a>
      <a th:href="@{/servicios}">
        <button class="btn btn-primary" type="button">Ver servicios</button>
      </a>
      <a th:href="@{/espacios}">
        <button class="btn btn-primary" type="button">Ver espacios</button>
      </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
