<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listar Usuarios</title>
  </head>
  <body>
    <h1>Listar Usuarios</h1>
    <table border="1">
      <thead>
        <tr>
          <th>id</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Telefono</th>
          <th>Rol</th>
          <th>Fecha registro</th>
          <th>Estado usuario</th>
          <th>Modificar usuario</th>
          <th>Modificar estado usuario</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="usuario : ${usuarios}">
          <td th:text="${usuario.id}"></td>
          <td th:text="${usuario.nombre}"></td>
          <td th:text="${usuario.email}"></td>
          <td th:text="${usuario.telefono}"></td>
          <td th:text="${usuario.rol}"></td>
          <td th:text="${usuario.fechaRegistro}"></td>
          <td th:text="${usuario.activo}"></td>
          <td>
            <a th:href="@{/usuario/actualizar/{id}(id =${usuario.id})}">
              <button type="button">Modificar Usuario</button>
            </a>
          </td>
          <td>
            <a th:href="@{/usuario/cambiarEstado/{id}(id =${usuario.id})}">
              <button type="button">Modificar Estado usuario</button>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
    <a th:href="@{/usuario/crearUsuario}">
      <button type="button">Crear usuario</button>
    </a>
    <a th:href="@{/reserva}">
      <button type="button">Ver reservas</button>
    </a>
    <a th:href="@{/servicios}">
      <button type="button">Ver servicios</button>
    </a>
  </body>
</html>
